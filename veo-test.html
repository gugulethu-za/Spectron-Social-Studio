<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veo image-to-video test</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#27264f;background:#f9eef4}body{margin:0;padding:32px}.wrap{max-width:760px;margin:auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 38px #27264f1a}h1{margin-top:0}label{display:block;font-weight:700;margin:18px 0 7px}input,textarea,select,button{font:inherit;width:100%;box-sizing:border-box}textarea,input,select{border:1px solid #c8c9d4;border-radius:8px;padding:10px}textarea{min-height:125px;resize:vertical}button{border:0;border-radius:8px;padding:12px 16px;background:#aa071b;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.warning{padding:14px;border-left:5px solid #aa071b;background:#fff3f4;margin:18px 0}.preview{display:block;max-width:100%;max-height:320px;margin-top:12px;border-radius:10px}.status{margin-top:18px;padding:12px;background:#eef3ee;border-radius:8px}.status[hidden],.error[hidden],#videoResult[hidden]{display:none}.error{margin-top:18px;padding:12px;background:#fff0f1;color:#8a0718;border-radius:8px}.progress{height:8px;overflow:hidden;background:#e3e5ec;border-radius:99px;margin-top:12px}.progress::after{content:"";display:block;width:35%;height:100%;background:#35c5d2;animation:move 1.2s infinite ease-in-out}@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(330%)}}video{display:block;width:100%;margin-top:18px;border-radius:10px;background:#111}.download{display:inline-block;width:auto;margin-top:12px;text-decoration:none;text-align:center;background:#218547;color:#fff;border-radius:8px;padding:11px 16px;font-weight:800}.small{font-size:.9rem;color:#5e6174}
</style></head>
<body><main class="wrap">
<h1>Veo image-to-video proof of concept</h1>
<p class="small">Local test page only. This is separate from Spectron Social Studio.</p>
<label for="imageInput">Product image</label>
<input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp">
<img id="imagePreview" class="preview" alt="Selected product image preview" hidden>
<label for="prompt">Prompt</label>
<textarea id="prompt">Create a professional four-second product showcase. Preserve the product’s exact appearance, colours, branding and proportions. Add subtle natural movement and a slow cinematic camera push-in. Keep the product clearly visible. Do not introduce new text, logos, products, people or objects.</textarea>
<label for="aspectRatio">Aspect ratio</label>
<select id="aspectRatio"><option value="16:9">Landscape 16:9</option><option value="9:16">Portrait 9:16</option></select>
<div class="warning"><strong>Paid test warning:</strong> clicking Generate and confirming will create one real paid Veo request. No request is sent before confirmation.</div>
<button id="generateButton" type="button" disabled>Generate one paid Veo test</button>
<div id="status" class="status" role="status" aria-live="polite" hidden></div>
<div id="progress" class="progress" role="progressbar" aria-label="Veo video generation in progress" hidden></div>
<div id="error" class="error" role="alert" hidden><span id="errorMessage"></span> <button id="retry" type="button" hidden>Retry</button></div>
<div id="videoResult" hidden><video id="video" controls autoplay muted playsinline></video><a id="download" class="download" href="#" download="veo-test.mp4">Download MP4</a></div>
</main>
<script>
const imageInput=document.getElementById('imageInput'), errorMessage=document.getElementById('errorMessage'), retry=document.getElementById('retry'), imagePreview=document.getElementById('imagePreview'), promptInput=document.getElementById('prompt'), aspectInput=document.getElementById('aspectRatio'), button=document.getElementById('generateButton'), statusEl=document.getElementById('status'), progress=document.getElementById('progress'), errorEl=document.getElementById('error'), videoResult=document.getElementById('videoResult'), video=document.getElementById('video'), download=document.getElementById('download');
let imageData='', imageUrl='', operation='', pollTimer=0, pollStartedAt=0, running=false;
function clearVideo(){video.pause();video.removeAttribute('src');video.load();videoResult.hidden=true;download.removeAttribute('href');}
function setError(details){const has=!!details;const message=typeof details==='string'?details:(details&&details.error)||'';let extra='';if(details&&details.googleStatus){extra=' (Google '+details.googleStatus+(details.googleCode?', '+details.googleCode:'')+(details.googleMessage?': '+details.googleMessage:'')+')';}errorMessage.textContent=message+extra;errorEl.hidden=!has;retry.hidden=!has;}
function setLoading(loading){running=loading;button.disabled=loading||!imageData;button.textContent=loading?'Generating…':'Generate one paid Veo test';statusEl.hidden=!loading;progress.hidden=!loading;if(loading){statusEl.textContent='Generating your AI video. This may take several minutes…';clearVideo();}}
function clearPolling(){if(pollTimer){clearTimeout(pollTimer);pollTimer=0;}}
function cleanup(){clearPolling();if(imageUrl){URL.revokeObjectURL(imageUrl);imageUrl='';}clearVideo();}
imageInput.addEventListener('change',()=>{const file=imageInput.files[0];setError('');clearVideo();if(!file){imageData='';imagePreview.hidden=true;button.disabled=true;return;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){setError('Choose a JPEG, PNG or WebP image.');imageInput.value='';imageData='';button.disabled=true;return;}if(!file.size||file.size>20*1024*1024){setError('Choose a non-empty image no larger than 20 MB.');imageInput.value='';imageData='';button.disabled=true;return;}if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(file);imagePreview.src=imageUrl;imagePreview.hidden=false;const reader=new FileReader();reader.onload=()=>{imageData=reader.result;button.disabled=running?true:false;};reader.onerror=()=>{setError('The image could not be read.');imageData='';button.disabled=true;};reader.readAsDataURL(file);});
async function poll(){if(!running||!operation)return;if(Date.now()-pollStartedAt>=420000){clearPolling();setLoading(false);setError('Veo generation timed out after seven minutes. Retry when ready.');return;}try{const response=await fetch('/.netlify/functions/veo-test-status?operation='+encodeURIComponent(operation));const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not read Veo status.');if(result.state==='pending'){pollTimer=setTimeout(poll,10000);return;}if(result.state==='failed')throw new Error(result.message||'Google safety checks or Veo generation failed.');const source='/.netlify/functions/download-veo-test?operation='+encodeURIComponent(operation);video.src=source;download.href=source;videoResult.hidden=false;statusEl.hidden=true;progress.hidden=true;running=false;button.disabled=false;button.textContent='Generate one paid Veo test';}catch(error){clearPolling();setLoading(false);setError(error.message||'Veo generation failed. Retry when ready.');}}
async function generate(){if(running||!imageData)return;setError('');if(!window.confirm('This will create one real paid Veo request. Continue?'))return;operation='';clearPolling();setLoading(true);try{const response=await fetch('/.netlify/functions/start-veo-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imageData,prompt:promptInput.value.trim(),aspectRatio:aspectInput.value})});const result=await response.json();if(!response.ok){const error=new Error(result.error||'Veo request could not be started.');error.details=result;throw error;}operation=result.operation;if(!operation)throw new Error('Veo returned no operation reference.');pollStartedAt=Date.now();pollTimer=setTimeout(poll,10000);}catch(error){setLoading(false);setError(error.details||error.message||'Veo request failed. Retry when ready.');}}
button.addEventListener('click',generate);retry.addEventListener('click',generate);window.addEventListener('pagehide',cleanup);
</script></body></html>
